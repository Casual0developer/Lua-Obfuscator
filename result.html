<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result — LuaVeil</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111a29;--line:#243147;--text:#eef5ff;--muted:#91a2bc;--accent:#73efd1;--secondary:#9ea7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#17263d 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}button,textarea{font:inherit}.shell{display:flex;flex-direction:column;min-height:100vh;max-width:1560px;margin:auto;padding:26px 32px 30px}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:25px;border-bottom:1px solid #24314799}.brand{display:inline-flex;align-items:center;gap:10px;font-size:21px;font-weight:760;letter-spacing:-.6px}.brand-name span{color:var(--accent)}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #3b746d;border-radius:10px;background:#15312f;color:var(--accent);font:700 13px Consolas,monospace}nav{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#0c1421}nav a{padding:8px 13px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600}nav a:hover{color:var(--text);background:#1b283d}nav a[aria-current]{background:#223249;color:var(--text)}.local-status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.local-status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #73efd155}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:27px 0 23px}.eyebrow{display:block;margin-bottom:7px;color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 8px;font-size:clamp(27px,3vw,38px);line-height:1.15;letter-spacing:-1.4px}p{color:var(--muted)}#intro{margin:0;max-width:850px;font-size:14px;line-height:1.6}.back-link{flex:none;color:var(--secondary);font-size:13px;font-weight:600}.back-link:hover{color:#d1d6ff}
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:20px}.stats:empty{display:none}.pill{min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:#101a29bb;color:var(--muted);font-size:12px;line-height:1.5}.pill strong{display:block;margin-bottom:3px;color:var(--text);font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.card{display:flex;flex:1;flex-direction:column;min-height:480px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 18px 55px #0002}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;padding:17px 20px;border-bottom:1px solid var(--line);background:#131f30}.bar-title{font-weight:650}.file-label{color:var(--muted);font:12px Consolas,monospace}textarea{display:block;flex:1;min-height:360px;min-width:0;width:100%;height:auto;resize:none;padding:23px 24px;border:0;outline:0;background:#0c1420;color:#dbe9fc;font:13px/1.7 Consolas,Monaco,monospace;tab-size:2;scrollbar-color:#35465f #0c1420;caret-color:var(--accent)}textarea:focus-visible{box-shadow:inset 0 0 0 2px #73efd155}.actions{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line);background:#101a29}.action-hint{margin-left:auto;color:var(--muted);font-size:11px}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:41px;padding:10px 16px;border:1px solid #31435e;border-radius:9px;background:#1a283c;color:var(--text);font:650 13px "Segoe UI",Arial,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}button:hover:not(:disabled),.button:hover{background:#253753;border-color:#4a617e}.primary{background:var(--accent);border-color:var(--accent);color:#08281f}.primary:hover:not(:disabled){background:#a0f9e4;border-color:#a0f9e4}button:active:not(:disabled),.button:active{transform:translateY(1px)}button:disabled{opacity:.42;cursor:default}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.notice{min-height:20px;margin:14px 2px 0;color:#ffcfad;font-size:13px}
@media(min-width:1600px){.card{min-height:560px}}@media(max-width:1050px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.local-status{display:none}}@media(max-width:680px){.shell{padding:18px 16px 22px}.site-header{gap:15px;flex-wrap:wrap;padding-bottom:18px}.brand{font-size:20px}nav{margin-left:auto}nav a{padding:7px 10px;font-size:12px}.page-heading{align-items:flex-start;flex-direction:column;gap:12px;padding:23px 0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pill{padding:11px 13px}.card{min-height:440px}.bar{padding:15px}.file-label{font-size:11px}textarea{min-height:330px;padding:18px;font-size:12px}.actions{padding:13px;gap:8px}.actions button,.actions .button{flex:1}.action-hint{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span class="brand-name">Lua<span>Veil</span></span></a><nav aria-label="Main navigation"><a href="index.html">Workspace</a><a href="result.html" aria-current="page">Output</a><a href="help.html">Guide</a></nav><span class="local-status">Offline workspace</span></header>
<div class="page-heading"><div><span class="eyebrow">Workspace / Output</span><h1>Your obfuscated Lua</h1><p id="intro">Review, copy, or download the result.</p></div><a class="back-link" href="index.html">← Back to editor</a></div><div class="stats" id="stats"></div>
<section class="card" aria-label="Generated file"><div class="bar"><span class="bar-title">Output Lua</span><span class="file-label">obfuscated.lua</span></div><textarea id="output" spellcheck="false" wrap="off" aria-label="Obfuscated Lua output" readonly></textarea><div class="actions"><button class="primary" id="copy" disabled>Copy code</button><button id="download" disabled>Download .lua</button><a class="button" href="index.html">Edit input</a><span class="action-hint">UTF-8 · Lua source</span></div></section>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
</div><script>
"use strict";
const output=document.getElementById('output'),notice=document.getElementById('notice');
let item=null;
try{
  const stored=sessionStorage.getItem('luaveil-result');
  if(stored&&stored.length<=16*1024*1024){
    const value=JSON.parse(stored);
    if(value&&value.schema===2&&typeof value.output==='string'&&value.output.length>0&&value.output.length<=8*1024*1024&&['Luau','5.1','5.2','5.3','LuaJIT'].includes(value.version))item=value;
  }
}catch{}
const count=value=>Number.isSafeInteger(value)&&value>=0&&value<=10000000?value:0;
if(!item){
  document.getElementById('intro').textContent='No current result was found. Generate a result on the obfuscator page.';
  notice.textContent='Results are kept only in this browser tab.';
}else{
  output.value=item.output;
  document.getElementById('copy').disabled=false;document.getElementById('download').disabled=false;
  for(const [label,value] of [['Local names scrambled',count(item.renamed)],['Encoded references',count(item.encoded)],['Unique constants',count(item.uniqueStrings)],['Encoding layers',count(item.layers)],['Watermark comments',count(item.watermarks)],['Junk blocks added',count(item.junk)],['Lua version',item.version]]){
    const pill=document.createElement('div'),strong=document.createElement('strong');pill.className='pill';strong.textContent=String(value);pill.appendChild(strong);pill.appendChild(document.createTextNode(' '+label));document.getElementById('stats').appendChild(pill);
  }
  if(count(item.watermarks)>0)document.getElementById('intro').textContent='The two supplied watermark comments are on separate header lines. The code body is condensed when that option is enabled.';
}
document.getElementById('copy').onclick=async()=>{
  if(!item)return;
  let copied=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(item.output);copied=true;}}catch{}
  if(!copied){try{output.focus();output.select();copied=document.execCommand('copy')===true;}catch{}}
  notice.textContent=copied?'Copied to clipboard.':'Copy was unavailable. Select the output and press Ctrl+C.';
};
document.getElementById('download').onclick=()=>{
  if(!item)return;
  const url=URL.createObjectURL(new Blob([item.output],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='obfuscated.lua';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
};
</script></body></html>
